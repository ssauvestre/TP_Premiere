name: Convert .py to one-cell .ipynb with Jupytext
on:
  push:
    paths:
      - '**/*.py'
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          pip install jupytext nbformat

      - name: Convert .py files to .ipynb (multi-cell)
        run: |
          python3 << 'EOF'
          import subprocess
          import os
          import sys

          failed = []
          success = []

          for root, dirs, files in os.walk("."):
              # Ignorer les dossiers cachés (.git, etc.)
              dirs[:] = [d for d in dirs if not d.startswith(".")]
              for name in files:
                  if name.endswith(".py"):
                      path = os.path.join(root, name)
                      result = subprocess.run(
                          ["jupytext", "--to", "ipynb", path],
                          capture_output=True, text=True
                      )
                      if result.returncode == 0:
                          success.append(path)
                          print(f"✅ Converti : {path}")
                      else:
                          failed.append(path)
                          print(f"⚠️  Ignoré (fichier incomplet ou invalide) : {path}")
                          print(result.stderr[:300])

          print(f"\n--- Résumé : {len(success)} converti(s), {len(failed)} ignoré(s) ---")
          for f in failed:
              print(f"  ⚠️  {f}")
          EOF

      - name: Merge all cells into a single cleaned cell
        run: |
          python3 << 'EOF'
          import nbformat
          import os

          BAD_PREFIXES = ["\ufeff", "\uFEFF", "\u200b", "\u202a", "\u202b", "·"]

          def clean_start(text):
              changed = True
              while changed:
                  changed = False
                  for bad in BAD_PREFIXES:
                      if text.startswith(bad):
                          text = text[len(bad):]
                          changed = True
              return text

          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if not d.startswith(".")]
              for name in files:
                  if name.endswith(".ipynb"):
                      path = os.path.join(root, name)
                      try:
                          nb = nbformat.read(path, as_version=4)
                          merged_source = ""
                          for cell in nb.cells:
                              if cell.cell_type == "code":
                                  merged_source += cell.source + "\n\n"
                              elif cell.cell_type == "markdown":
                                  merged_source += "# " + cell.source.replace("\n", "\n# ") + "\n\n"
                          merged_source = clean_start(merged_source)
                          nb.cells = [nbformat.v4.new_code_cell(merged_source)]
                          nbformat.write(nb, path)
                          print(f"✅ Fusionné : {path}")
                      except Exception as e:
                          print(f"⚠️  Ignoré (erreur fusion) : {path} — {e}")
          EOF

      - name: Commit merged notebooks
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add "*.ipynb"
          git commit -m "Auto-convert .py to ONE-CELL .ipynb" || echo "No changes to commit"

      - name: Push changes
        uses: ad-m/github-push-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
